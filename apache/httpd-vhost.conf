<VirtualHost *:80>
    DocumentRoot "/var/www/html"
    ServerName localhost

    # Default index file
    DirectoryIndex index.php index.html index.htm

    <Directory "/var/www/html">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy PHP files to PHP-FPM (localhost - single container)
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    # FastCGI timeout
    ProxyTimeout 60

    # SCRIPT_URI environment variable
    RewriteEngine On
    RewriteCond %{HTTPS} =on
    RewriteRule ^(.*)$ - [E=REQUEST_SCHEME:https]
    RewriteCond %{HTTPS} !=on
    RewriteRule ^(.*)$ - [E=REQUEST_SCHEME:http]
    RewriteRule ^(.*)$ - [E=SCRIPT_URI:%{ENV:REQUEST_SCHEME}://%{HTTP_HOST}%{REQUEST_URI}]

    # ===== PERFORMANCE =====
    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 5

    # --- gzip / deflate ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE application/xml application/xhtml+xml
        AddOutputFilterByType DEFLATE image/svg+xml application/font-woff font/woff2
        DeflateCompressionLevel 6
    </IfModule>

    # --- Brotli (br) ---
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css
        AddOutputFilterByType BROTLI_COMPRESS application/javascript application/json
        AddOutputFilterByType BROTLI_COMPRESS application/xml application/xhtml+xml
        AddOutputFilterByType BROTLI_COMPRESS image/svg+xml application/font-woff font/woff2
        BrotliCompressionQuality 5
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 year"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType application/x-font-woff "access plus 1 month"
        ExpiresByType font/woff2 "access plus 1 month"
    </IfModule>

    FileETag MTime Size

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Cache-Control "no-cache, no-store, must-revalidate" "expr=%{CONTENT_TYPE} =~ m#text/html#"

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
