####################################################
# All-in-One LAMP (single image)
# Usage: docker compose up -d --build
####################################################
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lamp-app
    restart: always
    ports:
      - "80:80"
      - "3306:3306"
      - "21:21"
    volumes:
      - ./www:/var/www/html                        # Application code
      - ./sql:/docker-entrypoint-initdb.d          # SQL init files
      - ./data:/var/lib/mysql                      # DB data (persistent)
      - ./logs/apache:/var/log/apache2             # Apache logs
      - ./logs/php:/var/log/php                    # PHP logs
      - ./logs/mariadb:/var/log/mysql              # MariaDB logs
      - ./logs/ftp:/var/log/ftp                    # FTP logs
      - ./logs/phpmyadmin:/var/log/phpmyadmin      # phpMyAdmin logs
    environment:
      PMA_ENABLED: ${PMA_ENABLED:-true}
      PMA_ADMIN_USER: ${PMA_ADMIN_USER:-pma_admin}
      PMA_ADMIN_PASS: ${PMA_ADMIN_PASS:-Pma@dmin2026}
      FTP_ENABLED: ${FTP_ENABLED:-false}
      FTP_USER: ${FTP_USER:-dev}
      FTP_PASS: ${FTP_PASS:-dev123}
