########################################################
# OpenLiteSpeed - Main Server Configuration
########################################################

serverName                lamp-app
user                      nobody
group                     nogroup
priority                  0
autoRestart               1
chrootPath                /
enableChroot              0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swap
autoFix503                1
gracefulRestartTimeout    300
mime                      conf/mime.properties
showVersionNumber         0
adminEmails               root@localhost

errorlog /usr/local/lsws/logs/error.log {
    logLevel              WARN
    debugLevel            0
    rollingSize           10M
    enableStderrLog       1
}

accessLog /usr/local/lsws/logs/access.log {
    rollingSize           10M
    keepDays              30
    compressArchive       0
}

# ===== Tuning =====
maxConnections            2000
maxSSLConnections         1000
connTimeout               300
maxKeepAliveReq           1000
keepAliveTimeout          5
sndBufSize                0
rcvBufSize                0
maxReqURLLen              32768
maxReqHeaderSize          65536
maxReqBodySize            2047M
maxDynRespHeaderSize      32768
maxDynRespSize            2047M
maxCachedSmallFileSize    4096
totalInMemCacheSize       20M
mappedStorePath           lscache
compressibleTypes         default

enableGzipCompress        1
enableBrCompress          1
enableDynGzipCompress     1
gzipCompressLevel         6
brStaticCompressLevel     6
gzipAutoUpdateStatic      1
gzipMaxFileSize           10M

# ===== Security =====
fileAccessControl {
    followSymbolLink        1
    checkSymbolLink         0
    forceStrictOwnership    0
    requiredPermissionMask  000
    restrictedPermissionMask 000
}

perClientConnLimit {
    staticReqPerSec         0
    dynReqPerSec            0
    outBandwidth            0
    inBandwidth             0
    softLimit               1000
    hardLimit               1500
    gracePeriod             15
    banPeriod               60
}

CGIRLimit {
    maxCGIInstances         20
    minUID                  11
    minGID                  10
    priority                0
    CPUSoftLimit            300
    CPUHardLimit            400
    memSoftLimit            1460M
    memHardLimit            1470M
    procSoftLimit           400
    procHardLimit           500
}

accessDenyDir {
    dir                     /
    dir                     /etc/*
    dir                     /dev/*
    dir                     /proc/*
    dir                     /sys/*
}

# ===== External App: PHP-FPM =====
extProcessor php-fpm {
    type                    fcgiSock
    address                 127.0.0.1:9000
    maxConns                35
    env                     PHP_LSAPI_CHILDREN=35
    initTimeout             60
    retryTimeout            0
    persistConn             1
    respBuffer              0
    autoStart               0
    path                    /usr/sbin/php-fpm
    backlog                 100
    instances               1
    extMaxIdleTime          -1
    runOnStartUp            0
    priority                0
    memSoftLimit            2047M
    memHardLimit            2047M
    procSoftLimit           400
    procHardLimit           500
}

# ===== Script Handler =====
scriptHandler {
    add lsapi:php-fpm php
}

# ===== Module: Cache =====
module cache {
    ls_enabled              0
}

# ===== Listener: HTTP on port 80 =====
listener HTTP {
    address                 *:80
    secure                  0
    map                     app *
}

# ===== Listener: Admin on port 7080 =====
listener Admin {
    address                 *:7080
    secure                  0
}

# ===== Virtual Host =====
virtualHost app {
    vhRoot                  /var/www/html
    configFile              conf/vhosts/app/vhconf.conf
    allowSymbolLink         1
    enableScript            1
    restrained              0
}
