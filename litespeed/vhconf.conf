########################################################
# OpenLiteSpeed - Virtual Host Configuration
########################################################

docRoot                   /var/www/html
enableGzip                1
enableBr                  1

# ===== Index Files =====
indexFiles                index.php, index.html, index.htm

# ===== Error Pages =====
errorlog /usr/local/lsws/logs/vhost_error.log {
    useServer             0
    logLevel              WARN
    rollingSize           10M
}

accessLog /usr/local/lsws/logs/vhost_access.log {
    useServer             0
    rollingSize           10M
    keepDays              30
    compressArchive       0
    logReferer            1
    logUserAgent          1
}

# ===== Script Handler =====
scriptHandler {
    add lsapi:php-fpm php
}

# ===== PHP-FPM External App =====
extProcessor php-fpm {
    type                    fcgiSock
    address                 127.0.0.1:9000
    maxConns                35
    initTimeout             60
    retryTimeout            0
    persistConn             1
    respBuffer              0
    autoStart               0
    instances               1
    extMaxIdleTime          -1
    runOnStartUp            0
    memSoftLimit            2047M
    memHardLimit            2047M
}

# ===== General Context (document root) =====
context / {
    location              /var/www/html/
    allowBrowse           1
    indexFiles             index.php, index.html, index.htm

    rewrite {
        enable            1
        autoLoadHtaccess  1
    }
}

# ===== phpMyAdmin Context =====
context /phpmyadmin/ {
    location              /opt/phpmyadmin/
    allowBrowse           1
    indexFiles             index.php

    accessLog /var/log/phpmyadmin/access.log {
        useServer         0
        rollingSize       10M
    }

    rewrite {
        enable            1
        autoLoadHtaccess  1
    }
}

# ===== Security Headers =====
context exp:^/(.*)$ {
    extraHeaders          <<<END_extraHeaders
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
    END_extraHeaders
}

# ===== Static File Cache / Expires =====
expires {
    enableExpires         1
}

expiresByType image/jpg=A2592000
expiresByType image/jpeg=A2592000
expiresByType image/png=A2592000
expiresByType image/gif=A2592000
expiresByType image/webp=A2592000
expiresByType image/svg+xml=A2592000
expiresByType image/x-icon=A31536000
expiresByType text/css=A604800
expiresByType application/javascript=A604800
expiresByType application/x-font-woff=A2592000
expiresByType font/woff2=A2592000

# ===== Rewrite Rules =====
rewrite {
    enable                1
    autoLoadHtaccess      1
}

# ===== File Access Control =====
fileAccessControl {
    followSymbolLink      1
    checkSymbolLink       0
}
